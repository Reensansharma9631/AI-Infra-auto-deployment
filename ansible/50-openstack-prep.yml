---
# OpenStack (Kolla) host preparation - runs before kolla-ansible bootstrap-servers.
#  * os_stop_host_libvirt (default true): host services that clash with Kolla's containers are stopped and masked
#    (libvirtd: Kolla runs its own nova_libvirt; mysql: port 3306 = Kolla MariaDB; the CloudStack agent/management server
#    that need them). They are recorded in /var/lib/autoinfra/os-stopped-services so 51-openstack-release.yml restores them.
#  * network nodes: the external (provider) interface - a dummy NIC when the name does not exist (lab without a spare NIC).
- name: OpenStack host preparation
  hosts: os_nodes
  become: true
  gather_facts: true
  vars:
    # virtlogd/virtlockd too: their sockets live in /run/libvirt, which Kolla bind-mounts into nova_libvirt - the containerized
    # libvirtd then used the HOST virtlogd, which cannot see the container's /var/lib/nova (real lab: 'Unable to open file:
    # /var/lib/nova/instances/<uuid>/console.log: No such file or directory', every VM build failed)
    os_clash_services: [cloudstack-agent, cloudstack-management, cloudstack-usage, mysql, mysqld, libvirtd, libvirtd.socket,
                        libvirtd-ro.socket, libvirtd-admin.socket, libvirtd-tcp.socket, libvirtd-tls.socket, virtqemud, virtqemud.socket,
                        virtlogd, virtlogd.socket, virtlogd-admin.socket, virtlockd, virtlockd.socket, virtlockd-admin.socket]
  tasks:
    - name: Which clashing host services exist and run
      ansible.builtin.shell: |
        for s in {{ os_clash_services | join(' ') }}; do
          if systemctl is-active --quiet "$s" 2>/dev/null || systemctl is-enabled --quiet "$s" 2>/dev/null; then echo "$s"; fi
        done
      register: os_clash
      changed_when: false
      when: os_stop_host_libvirt | default(true) | bool

    - name: Remember them (for 51-openstack-release.yml)
      ansible.builtin.lineinfile: {path: /var/lib/autoinfra/os-stopped-services, line: "{{ item }}", create: true, mode: "0644"}
      loop: "{{ os_clash.stdout_lines | default([]) }}"
      when: os_stop_host_libvirt | default(true) | bool

    - name: Stop and mask them
      ansible.builtin.systemd: {name: "{{ item }}", state: stopped, masked: true}
      loop: "{{ os_clash.stdout_lines | default([]) }}"
      when: (os_stop_host_libvirt | default(true) | bool) and (autoinfra_services | default(true) | bool)

    - name: Stale host libvirt sockets in /run/libvirt (shared with Kolla's nova_libvirt) - nobody may own them
      # a socket file left by the stopped host virtlogd made Kolla's libvirtd try it ('Connection refused') and its own
      # virtlogd die (real lab: defunct virtlogd, every VM build failed)
      ansible.builtin.shell: |
        removed=0
        for s in /run/libvirt/virtlogd-sock /run/libvirt/virtlogd-admin-sock /run/libvirt/virtlockd-sock /run/libvirt/virtlockd-admin-sock; do
          [ -S "$s" ] || continue
          if ! ss -xlp 2>/dev/null | grep -qF "$s "; then rm -f "$s" && removed=1 && echo "removed $s"; fi
        done
        if [ "$removed" = 1 ]; then
          for e in podman docker; do command -v $e >/dev/null 2>&1 && $e inspect nova_libvirt >/dev/null 2>&1 && $e restart nova_libvirt >/dev/null && echo "restarted nova_libvirt"; done
        fi; true
      register: os_socks
      changed_when: "'removed' in os_socks.stdout"
      when: os_stop_host_libvirt | default(true) | bool

    - name: VMs left running under the host libvirt would keep their qemu processes - none may remain
      # '[q]emu': the pattern must not match this shell's own command line (real lab: pkill killed itself)
      ansible.builtin.shell: pgrep -c -f '[q]emu-system-x86_64.*guest=' || true
      register: os_qemu
      changed_when: false
      failed_when: false

    - name: Stop leftover host VMs (CloudStack system VMs/guests; CloudStack restarts them when it is restored)
      ansible.builtin.shell: |
        pkill -TERM -f '[q]emu-system-x86_64.*guest=' || true
        for i in $(seq 30); do pgrep -f '[q]emu-system-x86_64.*guest=' >/dev/null || exit 0; sleep 1; done
        pkill -KILL -f '[q]emu-system-x86_64.*guest=' || true
      when: (os_stop_host_libvirt | default(true) | bool) and (os_qemu.stdout | default('0') | int) > 0

- name: Leftover containers of services this configuration disables (Kolla does not remove them)
  hosts: os_nodes
  become: true
  gather_facts: false
  tasks:
    - name: ProxySQL when it is off (no VIP) - it would hold port 3306 before MariaDB
      ansible.builtin.shell: |
        for e in podman docker; do
          command -v $e >/dev/null 2>&1 || continue
          $e container exists proxysql 2>/dev/null || $e inspect proxysql >/dev/null 2>&1 || continue
          systemctl disable --now kolla-proxysql-container.service >/dev/null 2>&1 || true
          $e rm -f proxysql >/dev/null && echo removed
        done; true
      register: os_px
      changed_when: "'removed' in os_px.stdout"
      when: not (os_proxysql_enabled | default(true) | bool)

- name: External (provider) interface - on every node (OVN attaches the external bridge on the computes too)
  hosts: os_nodes
  become: true
  gather_facts: false
  tasks:
    - name: Does it exist?
      ansible.builtin.command: "ip link show {{ os_external_interface }}"
      register: os_ext
      changed_when: false
      failed_when: false

    - name: Is it our dummy (re-runs keep the unit managed)?
      ansible.builtin.stat: {path: /etc/systemd/system/autoinfra-os-ext.service}
      register: os_ext_unit

    - name: Remember
      ansible.builtin.set_fact: {os_ext_is_dummy: "{{ os_ext_unit.stat.exists }}"}

    - name: Dummy external interface (persistent)
      when: os_ext.rc != 0 or os_ext_is_dummy | default(false) | bool
      block:
        - name: Unit
          ansible.builtin.copy:
            dest: /etc/systemd/system/autoinfra-os-ext.service
            mode: "0644"
            content: |
              # managed by AutoInfra - external interface for Neutron when the host has no spare NIC
              [Unit]
              Description=AutoInfra OpenStack external interface {{ os_external_interface }}
              Before=network-online.target
              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/bin/sh -c 'ip link show {{ os_external_interface }} >/dev/null 2>&1 || ip link add {{ os_external_interface }} type dummy'
              ExecStart=/usr/sbin/ip link set {{ os_external_interface }} up
              [Install]
              WantedBy=multi-user.target
        - name: Up now and at boot
          ansible.builtin.systemd: {name: autoinfra-os-ext.service, enabled: true, state: started, daemon_reload: true}
          when: autoinfra_services | default(true) | bool
