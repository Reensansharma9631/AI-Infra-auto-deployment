---
# Restart the management servers one by one after the global setting 'host' (VIP or server list) changed.
# Idempotent: the applied value is remembered on each server; a re-run with the same value restarts nothing.
- name: Restart CloudStack management servers
  hosts: cs_mgmt
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Remember the 'host' setting this server was restarted for
      ansible.builtin.copy:
        dest: /etc/cloudstack/management/.airgap-host-setting
        content: "{{ cs_host_setting | default('') }}\n"
        mode: "0644"
      register: hs
    - name: Restart
      ansible.builtin.service: {name: cloudstack-management, state: restarted}
      when: hs is changed
    - name: Wait for the UI/API port
      ansible.builtin.wait_for: {port: "{{ cs_ui_port | default(8080) }}", host: "{{ ansible_host }}", timeout: 900}
