[defaults]
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
forks = 20
timeout = 30
interpreter_python = auto_silent
nocolor = True
stdout_callback = default

[ssh_connection]
pipelining = True
# network blips: ssh itself re-tries 4 times before a host is marked unreachable
retries = 4
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=15
