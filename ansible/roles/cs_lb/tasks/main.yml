---
- name: Open the needed ports when a host firewall is active
  ansible.builtin.include_role:
    name: airgap_repo
    tasks_from: firewall
  vars:
    fw_ports: ["{{ cs_ui_port }}/tcp", "{{ cs_agent_port }}/tcp"]
    fw_protocols: ["vrrp"]

- name: OS specific names (Ubuntu / RHEL family)
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Validate inputs
  ansible.builtin.assert:
    that:
      - groups['cs_lb'] | length in [1, 2, 3]
      - groups['cs_mgmt'] | length >= 1
      - cs_mgmt_vip is defined and (cs_mgmt_vip | length) > 0
      - cs_mgmt_vrrp_pass is defined and (cs_mgmt_vrrp_pass | length) >= 4 and (cs_mgmt_vrrp_pass | length) <= 8
    fail_msg: "cs_lb needs 1-3 nodes, >=1 cs_mgmt node, and cs_mgmt_vip / cs_mgmt_vrrp_pass (Settings page)"
    quiet: true

- name: Install haproxy, keepalived
  ansible.builtin.package:
    name: "{{ lb_pkgs }}"
    state: present

- name: NIC that carries this node's IP
  ansible.builtin.shell: ip -o -4 addr show | awk -v ip="{{ ansible_host }}" '$4 ~ "^"ip"/" {print $2; exit}'
  register: nic_out
  changed_when: false

- name: Decide the VRRP interface
  ansible.builtin.set_fact:
    lb_iface: "{{ cs_mgmt_vrrp_iface if (cs_mgmt_vrrp_iface | length) > 0 else nic_out.stdout }}"

- name: Interface must be known
  ansible.builtin.assert:
    that: lb_iface | length > 0
    quiet: true

- name: Allow haproxy to bind the VIP while this node is BACKUP
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-airgap-lb.conf
    content: "net.ipv4.ip_nonlocal_bind = 1\n"
    mode: "0644"
  register: sysctl_file

- name: Apply sysctl
  ansible.builtin.command: sysctl -w net.ipv4.ip_nonlocal_bind=1
  when: sysctl_file is changed

- name: haproxy.cfg (validated before it is installed)
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: "0644"
    validate: /usr/sbin/haproxy -c -f %s
  notify: restart haproxy

- name: keepalived directories
  ansible.builtin.file: {path: /etc/keepalived/conf.d, state: directory, mode: "0755"}

- name: keepalived base config (only if no other role created it)
  ansible.builtin.template:
    src: keepalived-base.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: "0600"
    force: false
  notify: restart keepalived

- name: VRRP instance for the management VIP
  ansible.builtin.template:
    src: mgmt-vip.conf.j2
    dest: /etc/keepalived/conf.d/mgmt-vip.conf
    mode: "0600"
  no_log: true
  notify: restart keepalived

- name: Apply changes now
  ansible.builtin.meta: flush_handlers

- name: Services running
  ansible.builtin.service: {name: "{{ item }}", state: started, enabled: true}
  loop: [haproxy, keepalived]

- name: Result
  ansible.builtin.debug:
    msg: "Management VIP {{ cs_mgmt_vip }}: UI/API :{{ cs_ui_port }}, agents :{{ cs_agent_port }} -> {{ groups['cs_mgmt'] | length }} management server(s)"
  run_once: true
