---
- name: OS specific names (Ubuntu / RHEL family)
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags: always

- name: Supported OS
  ansible.builtin.assert:
    that: >-
      (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] in ['24.04', '22.04']) or
      (ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution_major_version'] in ['8', '9'])
    fail_msg: "unsupported OS {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
    quiet: true
  tags: always

- name: Set hostname
  ansible.builtin.hostname: {name: "{{ node_hostname }}"}
  when: manage_hostname | bool and node_hostname is defined
  tags: hostname

- name: Cluster-wide /etc/hosts block
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} AUTOINFRA MANAGED"
    unsafe_writes: true
    block: |
      {% for h in groups['all'] %}
      {{ hostvars[h].ansible_host }} {{ hostvars[h].node_hostname | default(h) }}
      {% endfor %}
  tags: hosts

- name: Resolver drop-in directory
  ansible.builtin.file: {path: "{{ '/etc/systemd/resolved.conf.d' if ansible_facts['os_family'] == 'Debian' else '/etc/NetworkManager/conf.d' }}", state: directory, mode: "0755"}
  when: autoinfra_node_dns | bool and master_ip is defined
  tags: dns

- name: "Resolver -> the master's DNS (Ubuntu - systemd-resolved drop-in)"
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/autoinfra.conf
    content: "# managed by AutoInfra - the master serves DNS for the estate\n[Resolve]\nDNS={{ master_ip }}\nDomains=~.\n"
    mode: "0644"
  when: autoinfra_node_dns | bool and master_ip is defined and ansible_facts['os_family'] == 'Debian'
  notify: restart systemd-resolved
  tags: dns

- name: "Resolver -> the master's DNS (RHEL family - NetworkManager global DNS)"
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/90-autoinfra-dns.conf
    content: "# managed by AutoInfra - the master serves DNS for the estate\n[global-dns-domain-*]\nservers={{ master_ip }}\n"
    mode: "0644"
  when: autoinfra_node_dns | bool and master_ip is defined and ansible_facts['os_family'] == 'RedHat'
  notify: reload NetworkManager
  tags: dns

- name: Base packages
  ansible.builtin.package:
    name: "{{ (common_os_pkgs | default(os_pkgs)) + common_packages }}"   # common_os_pkgs: replace the base list per host
    state: present
  tags: packages

- name: chrony -> master
  ansible.builtin.template: {src: chrony.conf.j2, dest: "{{ chrony_conf }}", mode: "0644"}
  notify: restart chrony
  tags: ntp

- name: chrony running
  ansible.builtin.service: {name: "{{ chrony_service }}", state: started, enabled: true}
  when: autoinfra_services | bool
  tags: ntp

- name: Grow the root partition and filesystem into free disk space
  ansible.builtin.include_tasks: growroot.yml
  when: common_grow_root | bool
  tags: growroot

- name: Static routes that apply to this host
  ansible.builtin.set_fact:
    common_my_routes: >-
      {%- set o = [] -%}
      {%- for r in autoinfra_static_routes if r.via != ansible_host and ansible_host not in (r.except | default([])) -%}
      {%- set _ = o.append(r) -%}
      {%- endfor -%}
      {{ o }}
  tags: routes

- name: Static routes (persistent, applied by a systemd unit at boot)
  ansible.builtin.include_tasks: routes.yml
  when: common_my_routes | length > 0
  tags: routes

- name: No routes for this host any more - remove an earlier route unit (and its routes)
  ansible.builtin.include_tasks: routes_remove.yml
  when: common_my_routes | length == 0
  tags: routes
