---
- name: Validate the internal network settings
  ansible.builtin.assert:
    that:
      - kvm_internal_net.bridge is match('^[A-Za-z0-9_.-]{1,12}$')
      - kvm_internal_net.bridge != kvm_bridge_name
      - (kvm_internal_net.addresses | default([]) | length) > 0 or ansible_host != (kvm_internal_net.gateway | default(ansible_host))
    fail_msg: "kvm_internal_net needs a bridge name (not {{ kvm_bridge_name }}) and, on the gateway host, at least one address"
    quiet: true

- name: VXLAN between the KVM hosts - open UDP 4789 when a host firewall is active
  ansible.builtin.include_role:
    name: airgap_repo
    tasks_from: firewall
  vars:
    fw_ports: ["4789/udp"]
  when: (kvm_internal_net.peers | default([]) | length) > 1

- name: IP forwarding (persistent)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-autoinfra-forward.conf
    content: "# managed by AutoInfra - this KVM host routes the internal CloudStack network\nnet.ipv4.ip_forward = 1\n"
    mode: "0644"

- name: Internal bridge unit
  ansible.builtin.template: {src: autoinfra-internal-net.service.j2, dest: /etc/systemd/system/autoinfra-internal-net.service, mode: "0644"}
  register: in_unit
  notify: restart cloudstack-agent

- name: Internal bridge up now and at boot
  ansible.builtin.systemd: {name: autoinfra-internal-net.service, enabled: true, state: "{{ 'restarted' if in_unit is changed else 'started' }}", daemon_reload: true}
  when: autoinfra_services | default(true) | bool
